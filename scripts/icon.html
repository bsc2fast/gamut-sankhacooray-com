<!doctype html><html><body style="margin:0;background:transparent">
<div id="w" style="width:100vw;height:100vh;display:grid;place-items:center"><img id="i" src="../public/icons/icon.svg" style="width:100%;height:100%"></div>
<script>
  // ?mask=1 draws the icon inside the central 60% on a solid background.
  if (location.search.includes('mask')) { w.style.background = '#0b0a14'; i.style.width = i.style.height = '60%'; }
  if (location.search.includes('bg')) w.style.background = '#0b0a14';
</script></body></html>
